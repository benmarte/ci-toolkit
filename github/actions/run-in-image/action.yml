name: ci-toolkit run-in-image
description: >-
  Run a test command inside a prebuilt image: skip it when its inputs already
  passed, restore caches into the container, bring up compose dependencies,
  run, record the pass, and upload a short-lived artifact. The step both
  reusable workflows (test-in-image, e2e) are built from; usable directly in
  a caller's own job too.
inputs:
  image:
    description: Image to run (e.g. the docker-build workflow's `image` output)
    required: true
  command:
    description: Shell command to run inside the image
    required: true
  env:
    description: Newline-separated KEY=VALUE (or KEY to pass the job's value through) for the container
    required: false
    default: ""
  workdir:
    description: Working directory in the container (the workspace is mounted there)
    required: false
    default: /work
  user:
    description: Container user; "host" runs as the runner's uid:gid so written files stay removable
    required: false
    default: ""
  compose-file:
    description: Compose file(s) (newline-separated) for dependencies such as postgres. Empty = none.
    required: false
    default: ""
  compose-services:
    description: Space-separated services to start (default all in the file)
    required: false
    default: ""
  pass-name:
    description: Enable pass-cache under this name. Empty = always run.
    required: false
    default: ""
  pass-paths:
    description: >-
      Newline-separated inputs for the pass key. The image digest, command,
      env (with values), workdir, user, compose files and services are added
      automatically. Default: the whole repo.
    required: false
    default: ""
  pass-salts:
    description: Newline-separated extra strings for the pass key (tool versions, ...)
    required: false
    default: ""
  pass-backend:
    description: >-
      gha (default): GitHub cache — branch-scoped by GitHub, so a PR cannot
      plant a marker the default branch trusts. registry: markers as empty
      images, visible across branches but writable by any job with
      packages:write; only for platforms without a scoped cache.
    required: false
    default: gha
  cache-paths:
    description: >-
      Newline-separated directories INSIDE the container to persist between
      runs (e.g. /root/.cache/go-build). Each is mounted from a runner dir
      restored with actions/cache and saved as a rolling cache.
    required: false
    default: ""
  cache-key:
    description: Key stem for cache-paths (default ci-toolkit-run-<pass-name|job>)
    required: false
    default: ""
  artifact-name:
    description: Upload this artifact when set
    required: false
    default: ""
  artifact-path:
    description: Path(s) to upload (relative to the workspace)
    required: false
    default: ""
  artifact-retention-days:
    required: false
    default: "3"
  token:
    description: Registry token for pulling the image (and registry-backend markers), e.g. github.token
    required: false
    default: ""
  registry:
    required: false
    default: ghcr.io
outputs:
  skipped:
    description: "'true' when the inputs had already passed and nothing ran"
    value: ${{ steps.gate.outputs.run == 'false' && 'true' || 'false' }}
runs:
  using: composite
  steps:
    # Copy the scripts out of reach first: the test runs with the workspace
    # mounted read-write, and anything run after it must not be code the
    # test could have rewritten.
    - id: tk
      shell: bash
      run: |
        d="$RUNNER_TEMP/ci-toolkit-scripts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$RANDOM"
        cp -R "$GITHUB_ACTION_PATH/../../../scripts" "$d"
        echo "dir=$d" >> "$GITHUB_OUTPUT"

    - if: inputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REGISTRY: ${{ inputs.registry }}
      run: printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin >/dev/null

    - id: passkey
      if: inputs.pass-name != ''
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        NAME: ${{ inputs.pass-name }}
        PATHS: ${{ inputs.pass-paths }}
        SALTS: ${{ inputs.pass-salts }}
        IMAGE: ${{ inputs.image }}
        CMD: ${{ inputs.command }}
        ENVS: ${{ inputs.env }}
        WORKDIR: ${{ inputs.workdir }}
        RUN_USER: ${{ inputs.user }}
        COMPOSE_FILES: ${{ inputs.compose-file }}
        COMPOSE_SERVICES: ${{ inputs.compose-services }}
      run: |
        # shellcheck source=/dev/null
        . "$TK/lib/common.sh"
        # Salt by digest, not tag: a moved or forced tag is a different image.
        digest="$(image_digest "$IMAGE")"
        [ -n "$digest" ] || digest="unresolved:$IMAGE"
        args=(--name "$NAME" --salt "image=$digest" --salt "cmd=$CMD" --salt "workdir=$WORKDIR"
              --salt "user=$RUN_USER" --salt "services=$COMPOSE_SERVICES")
        # Pass-through env (bare KEY) is salted with its value, hashed.
        while IFS= read -r e; do
          [ -n "$e" ] || continue
          case "$e" in
            *=*) args+=(--salt "env=$e") ;;
            *) [[ "$e" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]] || { echo "::error::invalid env name: $e"; exit 1; }
               args+=(--salt "env=$e=$(printf '%s' "${!e-}" | sha256)") ;;
          esac
        done <<< "$ENVS"
        while IFS= read -r p; do [ -n "$p" ] && args+=(--path "$p"); done <<< "$PATHS"
        [ -n "$PATHS" ] || args+=(--path .)
        while IFS= read -r f; do [ -n "$f" ] && args+=(--path "$f"); done <<< "$COMPOSE_FILES"
        while IFS= read -r s; do [ -n "$s" ] && args+=(--salt "$s"); done <<< "$SALTS"
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" "$TK/pass-cache.sh" key "${args[@]}"

    - id: pass-registry
      if: inputs.pass-name != '' && inputs.pass-backend == 'registry'
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        REGISTRY: ${{ inputs.registry }}
        KEY: ${{ steps.passkey.outputs.key }}
      run: |
        ref="$REGISTRY/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/ci-pass"
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" "$TK/pass-cache.sh" check --backend registry --ref "$ref" --key "$KEY"
    - id: pass-gha
      if: inputs.pass-name != '' && inputs.pass-backend == 'gha'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ci-toolkit-pass
        key: ${{ steps.passkey.outputs.key }}
        lookup-only: true

    - id: gate
      shell: bash
      env:
        HIT: ${{ steps.pass-registry.outputs.hit == 'true' || steps.pass-gha.outputs.cache-hit == 'true' }}
        KEY: ${{ steps.passkey.outputs.key }}
      run: |
        if [ "$HIT" = "true" ]; then
          echo "run=false" >> "$GITHUB_OUTPUT"
          { echo "### ⏭️ Skipped — these exact inputs already passed"; echo "key \`$KEY\`"; } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "run=true" >> "$GITHUB_OUTPUT"
        fi

    - id: cachedirs
      if: steps.gate.outputs.run == 'true' && inputs.cache-paths != ''
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        PATHS: ${{ inputs.cache-paths }}
        STEM: ${{ inputs.cache-key }}
        NAME: ${{ inputs.pass-name }}
      run: |
        # shellcheck source=/dev/null
        . "$TK/lib/common.sh"
        base="$RUNNER_TEMP/ci-toolkit-cache"; i=0; vols=""
        while IFS= read -r p; do
          [ -n "$p" ] || continue
          mkdir -p "$base/$i"; vols+="$base/$i:$p"$'\n'; i=$((i + 1))
        done <<< "$PATHS"
        stem="${STEM:-ci-toolkit-run-${NAME:-$GITHUB_JOB}}-$(lower "$RUNNER_OS")"
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit dir "$base" >/dev/null
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit stem "$stem" >/dev/null
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit volumes "${vols%$'\n'}" >/dev/null
    - if: steps.cachedirs.outputs.dir != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.cachedirs.outputs.dir }}
        # Rolling: build/test caches change without the lockfile changing.
        key: ${{ steps.cachedirs.outputs.stem }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.cachedirs.outputs.stem }}-

    - id: compose
      if: steps.gate.outputs.run == 'true' && inputs.compose-file != ''
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        FILES: ${{ inputs.compose-file }}
        SERVICES: ${{ inputs.compose-services }}
      run: |
        # shellcheck source=/dev/null
        . "$TK/lib/common.sh"
        project="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(slug "$GITHUB_JOB")-$RANDOM"
        args=(-p "$project")
        while IFS= read -r f; do [ -n "$f" ] && args+=(-f "$f"); done <<< "$FILES"
        # shellcheck disable=SC2086 # SERVICES is a space-separated list
        docker compose "${args[@]}" up -d --wait $SERVICES
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit project "$project" >/dev/null
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit network "${project}_default" >/dev/null
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" emit files "$FILES" >/dev/null

    - id: run
      if: steps.gate.outputs.run == 'true'
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        IMAGE: ${{ inputs.image }}
        CMD: ${{ inputs.command }}
        ENVS: ${{ inputs.env }}
        VOLS: ${{ steps.cachedirs.outputs.volumes }}
        NETWORK: ${{ steps.compose.outputs.network }}
        WORKDIR: ${{ inputs.workdir }}
        RUN_USER: ${{ inputs.user }}
      run: |
        args=(--image "$IMAGE" --workdir "$WORKDIR")
        while IFS= read -r e; do [ -n "$e" ] && args+=(--env "$e"); done <<< "$ENVS"
        while IFS= read -r v; do [ -n "$v" ] && args+=(--volume "$v"); done <<< "$VOLS"
        [ -n "$NETWORK" ] && args+=(--network "$NETWORK")
        [ -n "$RUN_USER" ] && args+=(--user "$RUN_USER")
        "$TK/run-tests.sh" "${args[@]}" --cmd "$CMD"

    - if: always() && steps.compose.outputs.project != ''
      shell: bash
      env:
        PROJECT: ${{ steps.compose.outputs.project }}
        FILES: ${{ steps.compose.outputs.files }}
      run: |
        args=(-p "$PROJECT")
        while IFS= read -r f; do [ -n "$f" ] && args+=(-f "$f"); done <<< "$FILES"
        docker compose "${args[@]}" down -v --remove-orphans || true

    - if: success() && steps.run.outcome == 'success' && inputs.pass-name != '' && inputs.pass-backend == 'registry'
      shell: bash
      env:
        TK: ${{ steps.tk.outputs.dir }}
        REF: ${{ steps.pass-registry.outputs.ref }}
        KEY: ${{ steps.passkey.outputs.key }}
      run: |
        "$TK/pass-cache.sh" save --backend registry --ref "$REF" --key "$KEY" \
          || echo "::warning::ci-toolkit: could not record the pass marker (read-only token?)"
    - if: success() && steps.run.outcome == 'success' && inputs.pass-name != '' && inputs.pass-backend == 'gha'
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/ci-toolkit-pass" && date -u > "$RUNNER_TEMP/ci-toolkit-pass/marker"
    - if: success() && steps.run.outcome == 'success' && inputs.pass-name != '' && inputs.pass-backend == 'gha'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/ci-toolkit-pass
        key: ${{ steps.passkey.outputs.key }}

    - if: always() && steps.gate.outputs.run == 'true' && inputs.artifact-name != ''
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: ignore
