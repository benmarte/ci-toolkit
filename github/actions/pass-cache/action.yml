name: ci-toolkit pass-cache
description: >-
  Skip a job whose exact inputs already passed. mode=check computes the input
  hash and reports hit=true when a pass marker exists; mode=save records the
  marker after the job succeeded.
inputs:
  mode:
    description: check | save
    required: true
  name:
    description: Job name that owns the marker (check)
    required: false
    default: ""
  paths:
    description: Newline-separated inputs that decide the outcome (check)
    required: false
    default: ""
  salts:
    description: Newline-separated extra strings that change the outcome, e.g. tool versions (check)
    required: false
    default: ""
  key:
    description: The key printed by mode=check (save)
    required: false
    default: ""
  backend:
    description: >-
      gha (default): GitHub cache, branch-scoped by GitHub — a PR's markers
      are visible to that PR only, the default branch's to everyone, and no
      PR can write one the default branch trusts. registry: markers as empty
      images; visible across branches but forgeable by any job with
      packages:write. Use it only where no scoped cache exists.
    required: false
    default: gha
  ref:
    description: Registry repository for markers (backend=registry). Default ghcr.io/<owner>/<repo>/ci-pass
    required: false
    default: ""
  token:
    description: Registry token (backend=registry), e.g. github.token. Omit when already logged in.
    required: false
    default: ""
outputs:
  hit:
    description: "'true' when these inputs already passed (check)"
    value: ${{ (steps.check-registry.outputs.hit == 'true' || steps.check-gha.outputs.cache-hit == 'true') && 'true' || 'false' }}
  key:
    description: The marker key
    value: ${{ steps.key.outputs.key || inputs.key }}
runs:
  using: composite
  steps:
    - id: key
      if: inputs.mode == 'check'
      shell: bash
      env:
        NAME: ${{ inputs.name }}
        PATHS: ${{ inputs.paths }}
        SALTS: ${{ inputs.salts }}
      run: |
        args=(--name "$NAME")
        while IFS= read -r p; do [ -n "$p" ] && args+=(--path "$p"); done <<< "$PATHS"
        while IFS= read -r s; do [ -n "$s" ] && args+=(--salt "$s"); done <<< "$SALTS"
        CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" "$GITHUB_ACTION_PATH/../../../scripts/pass-cache.sh" key "${args[@]}"
    - id: ref
      if: inputs.backend == 'registry'
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        [ -n "$REF" ] || REF="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')/ci-pass"
        echo "ref=$REF" >> "$GITHUB_OUTPUT"
    - if: inputs.backend == 'registry' && inputs.token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.token }}
        REF: ${{ steps.ref.outputs.ref }}
      run: printf '%s' "$TOKEN" | docker login "${REF%%/*}" -u "$GITHUB_ACTOR" --password-stdin >/dev/null
    - id: check-registry
      if: inputs.mode == 'check' && inputs.backend == 'registry'
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.ref }}
        KEY: ${{ steps.key.outputs.key }}
      run: CI_TOOLKIT_OUTPUT="$GITHUB_OUTPUT" "$GITHUB_ACTION_PATH/../../../scripts/pass-cache.sh" check --backend registry --ref "$REF" --key "$KEY"
    - id: check-gha
      if: inputs.mode == 'check' && inputs.backend == 'gha'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ci-toolkit-pass
        key: ${{ steps.key.outputs.key }}
        lookup-only: true
    - if: inputs.mode == 'save' && inputs.backend == 'registry'
      shell: bash
      env:
        REF: ${{ steps.ref.outputs.ref }}
        KEY: ${{ inputs.key }}
      # Best effort: a read-only token (Dependabot) must not fail a green job.
      run: |
        "$GITHUB_ACTION_PATH/../../../scripts/pass-cache.sh" save --backend registry --ref "$REF" --key "$KEY" \
          || echo "::warning::ci-toolkit: could not record the pass marker (read-only token?)"
    - if: inputs.mode == 'save' && inputs.backend == 'gha'
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/ci-toolkit-pass" && date -u > "$RUNNER_TEMP/ci-toolkit-pass/marker"
    - if: inputs.mode == 'save' && inputs.backend == 'gha'
      uses: actions/cache/save@v6
      continue-on-error: true
      with:
        path: ${{ runner.temp }}/ci-toolkit-pass
        key: ${{ inputs.key }}
