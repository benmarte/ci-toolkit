# The toolkit's own CI. Public repo, so hosted minutes here are free.
# Exercises the reusable workflows exactly as a caller would, pinned to this
# commit, and asserts the two properties that save money: an unchanged image
# is not rebuilt, and a job whose inputs passed is skipped.
name: self-test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/lib/*.sh tests/*.sh
      - name: bats
        run: |
          sudo apt-get install -y -qq bats >/dev/null
          bats tests/scripts.bats
      - name: registry integration
        run: tests/integration.sh

  # Two builds of the same inputs: the second must not build.
  build-1:
    needs: unit
    uses: ./.github/workflows/docker-build.yml
    with:
      name: selftest
      file: tests/fixtures/Dockerfile
      context: tests/fixtures
      hash-paths: tests/fixtures
      toolkit-repo: ${{ github.repository }}
      toolkit-ref: ${{ github.sha }}
  build-2:
    needs: build-1
    uses: ./.github/workflows/docker-build.yml
    with:
      name: selftest
      file: tests/fixtures/Dockerfile
      context: tests/fixtures
      hash-paths: tests/fixtures
      toolkit-repo: ${{ github.repository }}
      toolkit-ref: ${{ github.sha }}

  # Same test twice: the second must be skipped by the pass marker. The salt
  # makes the key unique per run so run 1 always really runs.
  test-1:
    needs: build-2
    uses: ./.github/workflows/test-in-image.yml
    with:
      image: ${{ needs.build-2.outputs.image }}
      command: sh /fixture/check.sh && test -f /work/README.md
      pass-name: selftest
      pass-paths: tests/fixtures
      pass-salts: run=${{ github.run_id }}-${{ github.run_attempt }}
      toolkit-repo: ${{ github.repository }}
      toolkit-ref: ${{ github.sha }}
  test-2:
    needs: [build-2, test-1]
    uses: ./.github/workflows/test-in-image.yml
    with:
      image: ${{ needs.build-2.outputs.image }}
      command: sh /fixture/check.sh && test -f /work/README.md
      pass-name: selftest
      pass-paths: tests/fixtures
      pass-salts: run=${{ github.run_id }}-${{ github.run_attempt }}
      toolkit-repo: ${{ github.repository }}
      toolkit-ref: ${{ github.sha }}

  e2e:
    needs: build-2
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.build-2.outputs.image }}
      command: sh /fixture/check.sh && echo "shard {shard} of {total}" > shard-{shard}.txt
      shards: "[1,2]"
      artifact-path: shard-*.txt
      artifact-retention-days: 1
      toolkit-repo: ${{ github.repository }}
      toolkit-ref: ${{ github.sha }}

  assert:
    needs: [build-1, build-2, test-1, test-2]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Image reuse and pass skip
        env:
          B1: ${{ needs.build-1.outputs.built }}
          B2: ${{ needs.build-2.outputs.built }}
          I1: ${{ needs.build-1.outputs.image }}
          I2: ${{ needs.build-2.outputs.image }}
          T1: ${{ needs.test-1.outputs.skipped }}
          T2: ${{ needs.test-2.outputs.skipped }}
        run: |
          echo "build-1 built=$B1  build-2 built=$B2  test-1 skipped=$T1  test-2 skipped=$T2"
          [ "$I1" = "$I2" ] || { echo "::error::builds resolved different refs"; exit 1; }
          [ "$B2" = "false" ] || { echo "::error::second build rebuilt the same inputs"; exit 1; }
          [ "$T1" = "false" ] || { echo "::error::first test did not run"; exit 1; }
          [ "$T2" = "true" ] || { echo "::error::second test was not skipped"; exit 1; }
